<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="100%" height="auto" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Hollow triangle for generalization (inheritance) -->
    <marker id="inheritance" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    </marker>
    <!-- Hollow triangle for realization (interface implementation) -->
    <marker id="realization" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    </marker>
    <!-- Standard open arrow for association -->
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 1, 8 4.5, 0 8" fill="#334155" />
    </marker>
    <!-- Dashed dependency arrow -->
    <marker id="dep" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 7 4, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <!-- ================= Client: Main ================= -->
  <g transform="translate(20, 45)">
    <rect width="135" height="75" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    <text x="67" y="24" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Main</text>
    <line x1="0" y1="34" x2="135" y2="34" stroke="#cbd5e1" stroke-width="1" />
    <text x="8" y="52" font-size="10" fill="#334155">+ main(args: String[])</text>
    <text x="8" y="68" font-size="10" fill="#334155">+ runDemo(): void</text>
  </g>

  <!-- ================= Abstraction: Shape ================= -->
  <g transform="translate(205, 30)">
    <rect width="245" height="135" rx="3" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" />
    <text x="122" y="20" font-size="10" font-style="italic" fill="#2563eb" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text>
    <text x="122" y="34" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Shape</text>
    <line x1="0" y1="42" x2="245" y2="42" stroke="#93c5fd" stroke-width="1" />
    <text x="10" y="58" font-size="10.5" fill="#334155"># id: String</text>
    <text x="10" y="73" font-size="10.5" fill="#334155"># renderer: Renderer</text>
    <line x1="0" y1="81" x2="245" y2="81" stroke="#93c5fd" stroke-width="1" />
    <text x="10" y="97" font-size="10" fill="#334155">+ Shape(id: String, r: Renderer)</text>
    <text x="10" y="112" font-size="10" fill="#334155">+ setImplementation(r: Renderer)</text>
    <text x="10" y="127" font-size="10" font-style="italic" font-weight="bold" fill="#1d4ed8">+ {abstract} execute(): String</text>
  </g>

  <!-- ================= Implementor: Renderer ================= -->
  <g transform="translate(530, 45)">
    <rect width="260" height="95" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
    <text x="130" y="20" font-size="10" font-style="italic" fill="#059669" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text x="130" y="34" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">Renderer</text>
    <line x1="0" y1="42" x2="260" y2="42" stroke="#6ee7b7" stroke-width="1" />
    <text x="10" y="62" font-size="10.5" fill="#065f46">+ renderCircle(radius: int): String</text>
    <text x="10" y="80" font-size="10.5" fill="#065f46">+ renderSquare(side: int): String</text>
  </g>

  <!-- Association Bridge: Shape -> Renderer -->
  <line x1="450" y1="92" x2="528" y2="92" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="489" y="84" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle">- renderer</text>

  <!-- Dependency: Main -> Shape -->
  <line x1="155" y1="82" x2="203" y2="82" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#dep)" />

  <!-- ================= Refined Abstractions: Circle & Square ================= -->
  <g transform="translate(205, 235)">
    <rect width="115" height="90" rx="3" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2" />
    <text x="57" y="22" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Circle</text>
    <line x1="0" y1="32" x2="115" y2="32" stroke="#93c5fd" stroke-width="1" />
    <text x="8" y="48" font-size="10" fill="#334155">- radius: int</text>
    <line x1="0" y1="56" x2="115" y2="56" stroke="#93c5fd" stroke-width="1" />
    <text x="8" y="72" font-size="9.5" fill="#334155">+ Circle(id, r, radius)</text>
    <text x="8" y="86" font-size="9.5" font-weight="bold" fill="#1d4ed8">+ execute(): String</text>
  </g>

  <g transform="translate(335, 235)">
    <rect width="115" height="90" rx="3" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2" />
    <text x="57" y="22" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Square</text>
    <line x1="0" y1="32" x2="115" y2="32" stroke="#93c5fd" stroke-width="1" />
    <text x="8" y="48" font-size="10" fill="#334155">- side: int</text>
    <line x1="0" y1="56" x2="115" y2="56" stroke="#93c5fd" stroke-width="1" />
    <text x="8" y="72" font-size="9.5" fill="#334155">+ Square(id, r, side)</text>
    <text x="8" y="86" font-size="9.5" font-weight="bold" fill="#1d4ed8">+ execute(): String</text>
  </g>

  <!-- Inheritance lines from Circle and Square up to Shape -->
  <path d="M 262 235 L 262 200 L 327 200 L 327 167" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#inheritance)" />
  <path d="M 392 235 L 392 200 L 327 200" stroke="#334155" stroke-width="1.5" fill="none" />

  <!-- ================= Concrete Implementors: Vector, Raster, Ascii ================= -->
  <g transform="translate(490, 235)">
    <rect width="115" height="90" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1.2" />
    <text x="57" y="22" font-size="11" font-weight="bold" fill="#065f46" text-anchor="middle">VectorRenderer</text>
    <line x1="0" y1="32" x2="115" y2="32" stroke="#6ee7b7" stroke-width="1" />
    <text x="6" y="52" font-size="9" fill="#334155">+ renderCircle(r)</text>
    <text x="6" y="72" font-size="9" fill="#334155">+ renderSquare(s)</text>
  </g>

  <g transform="translate(615, 235)">
    <rect width="115" height="90" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1.2" />
    <text x="57" y="22" font-size="11" font-weight="bold" fill="#065f46" text-anchor="middle">RasterRenderer</text>
    <line x1="0" y1="32" x2="115" y2="32" stroke="#6ee7b7" stroke-width="1" />
    <text x="6" y="52" font-size="9" fill="#334155">+ renderCircle(r)</text>
    <text x="6" y="72" font-size="9" fill="#334155">+ renderSquare(s)</text>
  </g>

  <g transform="translate(740, 235)">
    <rect width="115" height="90" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1.2" />
    <text x="57" y="22" font-size="11" font-weight="bold" fill="#065f46" text-anchor="middle">AsciiRenderer</text>
    <line x1="0" y1="32" x2="115" y2="32" stroke="#6ee7b7" stroke-width="1" />
    <text x="6" y="52" font-size="9" fill="#334155">+ renderCircle(r)</text>
    <text x="6" y="72" font-size="9" fill="#334155">+ renderSquare(s)</text>
  </g>

  <!-- Realization lines up to Renderer -->
  <path d="M 547 235 L 547 180 L 660 180 L 660 142" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#realization)" />
  <path d="M 672 235 L 672 180" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" fill="none" />
  <path d="M 797 235 L 797 180 L 660 180" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" fill="none" />

</svg>
